<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Products</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #4caf50;
            color: #fff;
            text-align: center;
            padding: 1em;
        }

        section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1em;
        }

        .category {
            width: 70%;
            background-color: #fff;
            margin: 1em;
            padding: 1em;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        .category:hover {
            transform: scale(1.05);
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        .product {
            width: 20%;
            background-color: #fff;
            margin: 1em;
            padding: 1em;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        .product:hover {
            transform: scale(1.05);
        }

        .product img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }

        .product p.price {
            color: #3498db;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 1em;
        }

        #search-bar {
            margin: 1em;
            padding: 0.5em;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 50%;
        }

        footer {
            background-color: #4CAF50;
            color: #fff;
            text-align: center;
            padding: 20px 0;
        }

        form {
            background-color: #fff;
            padding: 1em;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 50%;
            margin: 2em auto;
            text-align: center;
        }

        form label {
            display: block;
            margin: 0.5em 0;
        }

        form input, form select {
            width: calc(100% - 1em);
            padding: 0.5em;
            margin-bottom: 1em;
        }

        form button {
            background-color: #4caf50;
            color: white;
            padding: 0.7em 1.5em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Agriculture Products</h1>
        <input type="text" id="search-bar" placeholder="Search products...">
    </header>

    <form id="product-form">
        <label for="product-name">Product Name:</label>
        <input type="text" id="product-name" name="product-name" required>
        
        <label for="product-description">Description:</label>
        <input type="text" id="product-description" name="product-description" required>

        <label for="product-price">Price:</label>
        <input type="number" id="product-price" name="product-price" required>

        <label for="product-image">Image:</label>
        <input type="file" id="product-image" name="product-image" accept="image/*" required>

        <label for="product-category">Category:</label>
        <select id="product-category" name="product-category" required>
            <option value="animal-husbandry">Animal Husbandry</option>
            <option value="agricultural-pesticides-fertilizers">Agricultural Pesticides & Fertilizers</option>
            <option value="agricultural-equipment">Agricultural Equipment</option>
            <option value="vegetables">Vegetables</option>
        </select>

        <button type="submit">Add Product</button>
    </form>

    <section id="product-section">
        <div class="category" id="animal-husbandry">
            <h2>Animal Husbandry</h2>
            <div class="product-container">
                <!-- Existing products go here -->
            </div>
        </div>

        <div class="category" id="agricultural-pesticides-fertilizers">
            <h2>Agricultural Pesticides & Fertilizers</h2>
            <div class="product-container">
                <!-- Existing products go here -->
            </div>
        </div>

        <div class="category" id="agricultural-equipment">
            <h2>Agricultural Equipment</h2>
            <div class="product-container">
                <!-- Existing products go here -->
            </div>
        </div>

        <div class="category" id="vegetables">
            <h2>Vegetables</h2>
            <div class="product-container">
                <!-- Existing products go here -->
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 Agriculture Products. All rights reserved.</p>
    </footer>
    <script>
        document.getElementById('product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var productName = document.getElementById('product-name').value;
            var productDescription = document.getElementById('product-description').value;
            var productPrice = document.getElementById('product-price').value;
            var productImage = document.getElementById('product-image').files[0];
            var productCategory = document.getElementById('product-category').value;
    
            // Create a FileReader to read the uploaded image
            var reader = new FileReader();
            reader.onload = function(e) {
                var productContainer = document.querySelector(`#${productCategory} .product-container`);
                var newProduct = document.createElement('div');
                newProduct.className = 'product';
                newProduct.innerHTML = `
                    <img src="${e.target.result}" alt="${productName}">
                    <h3>${productName}</h3>
                    <p>${productDescription}</p>
                    <p class="price">Price: $${productPrice}</p>
                    <button class="buy-button">Buy</button>
                `;
                productContainer.appendChild(newProduct);
    
                // Attach event listener to the buy button
                newProduct.querySelector('.buy-button').addEventListener('click', function() {
                    var confirmation = confirm(`Are you sure you want to buy ${productName} for $${productPrice}?`);
                    if (confirmation) {
                        addToCart(productName, productPrice);
                        alert(`You have successfully bought ${productName} for $${productPrice}!`);
                    }
                });
            };
            reader.readAsDataURL(productImage);
    
            // Clear the form
            document.getElementById('product-form').reset();
        });
    
        function addToCart(name, price) {
            alert(`Added ${name} to cart at $${price}`);
            // Here you can add the code to actually add the item to the cart
        }
    </script>
    
</body>
</html>
